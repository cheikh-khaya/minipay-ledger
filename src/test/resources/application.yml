# Test configuration: in-memory H2 database in PostgreSQL compatibility mode.
# The same schema.sql is executed, so tests exercise the real table definitions.
spring:
  datasource:
    url: jdbc:h2:mem:minipay;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
