spring:
  application:
    name: minipay-ledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/minipay}
    username: ${DB_USER:minipay}
    password: ${DB_PASSWORD:minipay}
  sql:
    init:
      # Runs src/main/resources/schema.sql at startup (all statements use IF NOT EXISTS)
      mode: always
  jpa:
    hibernate:
      # The schema is owned by schema.sql, not generated by Hibernate
      ddl-auto: none
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
